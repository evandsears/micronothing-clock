    body {
      font-family: 'Geist Mono', ui-monospace, monospace;
    }
    .blueprint-grid {
      background-color: #92a6b8;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.22) 1.2px, transparent 1.2px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.22) 1.2px, transparent 1.2px);
      background-size: 24px 24px;
    }
    .svg-icon {
      display: inline-block;
      vertical-align: middle;
      height: 100%;
      width: auto;
    }
    .svg-icon path, .svg-icon rect {
      transition: fill 0.2s, stroke 0.2s;
    }
  </style>
</head>
<body class="bg-transparent text-[var(--foreground)] antialiased p-3 sm:p-5 flex flex-col items-center justify-center">

    function getHandsHtml(minutes) {
      if (minutes < 0) return handMarkers[2]; // Peace sign for open day
      if (minutes === 0) return handMarkers[1];

      let html = '';
      const tens = Math.min(5, Math.max(0, Math.floor(minutes / 10)));
      const units = minutes % 10;

      if (tens > 0) {
        html += handMarkers[tens];
      }

      if (units >= 1 && units <= 5) {
        html += handMarkers[units];
      } else if (units >= 6 && units <= 9) {
        html += handMarkers[5] + handMarkers[units - 5];
      }

      return html || handMarkers[1];
    }

    function setTheme(t) {
      const c = document.getElementById('clockCanvas');
      const w = document.getElementById('watermark');
      const tzTxt = document.getElementById('txtTimezone');
      const tzBase = document.getElementById('tzBaseSvg');
      const content = document.getElementById('widgetContent');

      if (tzBase) {
        tzBase.className = (t === 'frosted') ? 'h-full flex items-center text-[#14161B]' : 'h-full flex items-center text-white';
      }

      if (t === 'blueprint') {
        c.className = 'w-full blueprint-grid rounded-2xl p-6 sm:p-10 shadow-2xl relative select-none overflow-hidden transition-all duration-300';
        w.style.display = 'block';
        content.className = 'w-full flex flex-col space-y-5 sm:space-y-7 text-white font-bold tracking-wider pt-2';
        tzTxt.style.color = '#92a6b8';
      } else if (t === 'material_you') {
        c.className = 'w-full bg-[#273244] rounded-2xl p-6 sm:p-10 shadow-2xl relative select-none overflow-hidden transition-all duration-300 border border-blue-300/20';
        w.style.display = 'none';
        content.className = 'w-full flex flex-col space-y-5 sm:space-y-7 text-[#E2E8F0] font-bold tracking-wider pt-2';
        tzTxt.style.color = '#273244';
      } else if (t === 'frosted') {
        c.className = 'w-full bg-gradient-to-br from-white/85 via-white/70 to-white/55 backdrop-blur-2xl rounded-2xl p-6 sm:p-10 shadow-[0_24px_50px_rgba(0,0,0,0.28),inset_0_1.5px_1px_rgba(255,255,255,0.95),inset_0_0_24px_rgba(255,255,255,0.35)] relative select-none overflow-hidden transition-all duration-300 border border-white/85';
        w.style.display = 'none';
        content.className = 'w-full flex flex-col space-y-5 sm:space-y-7 text-[#121316] font-bold tracking-wider pt-2';
        tzTxt.style.color = '#FFFFFF';
      } else if (t === 'amoled') {
        c.className = 'w-full bg-black rounded-2xl p-6 sm:p-10 shadow-2xl relative select-none overflow-hidden transition-all duration-300 border border-neutral-800';
        w.style.display = 'none';
        content.className = 'w-full flex flex-col space-y-5 sm:space-y-7 text-white font-bold tracking-wider pt-2';
        tzTxt.style.color = '#000000';
      } else if (t === 'red') {
        c.className = 'w-full bg-[#180608] rounded-2xl p-6 sm:p-10 shadow-2xl relative select-none overflow-hidden transition-all duration-300 border border-[#D71920]/40';
        w.style.display = 'none';
        content.className = 'w-full flex flex-col space-y-5 sm:space-y-7 text-white font-bold tracking-wider pt-2';
        tzTxt.style.color = '#180608';
      } else if (t === 'floating') {
        c.className = 'w-full bg-slate-700/80 rounded-2xl p-6 sm:p-10 shadow-none relative select-none overflow-hidden transition-all duration-300';
        w.style.display = 'none';
        content.className = 'w-full flex flex-col space-y-5 sm:space-y-7 text-white font-bold tracking-wider pt-2 drop-shadow-md';
        tzTxt.style.color = '#334155';
      }
    }

    function onTempSliderChange(val) {
      currentTemp = parseInt(val);
      document.getElementById('txtTemp').innerText = currentTemp + '°';
      document.getElementById('sliderVal').innerText = currentTemp + '°' + currentUnit;

      const tb = document.getElementById('tempBarContainer');
      const tempF = (currentUnit === 'F') ? currentTemp : (currentTemp * 9/5 + 32);
      if (tempF >= 80) {
        tb.innerHTML = tempBarSvgs['high'];
      } else if (tempF >= 60) {
        tb.innerHTML = tempBarSvgs['mid'];
      } else {
        tb.innerHTML = tempBarSvgs['low'];
      }
    }

    function setUnit(u) {
      currentUnit = u;
      const btnF = document.getElementById('btnUnitF');
      const btnC = document.getElementById('btnUnitC');
      const s = document.getElementById('tempSlider');
      if (u === 'F') {
        btnF.className = 'px-2 py-0.5 rounded bg-[#D71920] text-white font-bold text-[11px]';
        btnC.className = 'px-2 py-0.5 rounded bg-[var(--muted)] text-[var(--muted-foreground)] font-bold text-[11px]';
        s.min = 30; s.max = 105; s.value = 80;
        onTempSliderChange(80);
      } else {
        btnC.className = 'px-2 py-0.5 rounded bg-[#D71920] text-white font-bold text-[11px]';
        btnF.className = 'px-2 py-0.5 rounded bg-[var(--muted)] text-[var(--muted-foreground)] font-bold text-[11px]';
        s.min = 0; s.max = 40; s.value = 27;
        onTempSliderChange(27);
      }
      document.getElementById('unitContainer').innerHTML = unitSvgs[u];
    }

    function setWeather(cond) {
      if (weatherSvgs[cond]) {
        document.getElementById('weatherSpecContainer').innerHTML = weatherSvgs[cond];
      }
    }

    function setEventMinutes(minutes) {
      if (minutes >= 0) {
        document.getElementById('txtEvent').innerText = currentEventTitle || 'WEEKLY DESIGN SYNC';
        document.getElementById('txtStatus').innerText = 'STARTING';
        document.getElementById('txtCountdown').innerText = `${minutes}MIN`;
        document.getElementById('handsContainer').innerHTML = getHandsHtml(minutes);
      } else if (minutes === -2) {
        document.getElementById('txtEvent').innerText = "MOM'S BIRTHDAY";
        document.getElementById('txtStatus').innerText = 'ALL DAY';
        document.getElementById('txtCountdown').innerText = 'TODAY';
        document.getElementById('handsContainer').innerHTML = getHandsHtml(-1);
      } else {
        const q = quippies[quippyIndex % quippies.length];
        quippyIndex++;
        document.getElementById('txtEvent').innerText = q;
        document.getElementById('txtStatus').innerText = 'ALL CLEAR';
        document.getElementById('txtCountdown').innerText = 'OPEN';
        document.getElementById('handsContainer').innerHTML = getHandsHtml(-1);
      }
    }

    function setEventState(active) {
      setEventMinutes(active ? 35 : -1);
    }

    function setTimezone(tz) {
      document.getElementById('txtTimezone').innerText = tz;
    }

    let currentHeightMode = '4x2';
    let currentEventTitle = 'WEEKLY DESIGN SYNC WITH LEADERSHIP';

    function onCustomEventInput(val) {
      currentEventTitle = val.toUpperCase().trim() || 'WEEKLY DESIGN SYNC';
      updateEventDisplay();
    }

    function setHeightMode(mode) {
      currentHeightMode = mode;
      const canvas = document.getElementById('clockCanvas');
      const btn4x2 = document.getElementById('btnSize4x2');
      const btn4x3 = document.getElementById('btnSize4x3');
      const btn4x4 = document.getElementById('btnSize4x4');

      [btn4x2, btn4x3, btn4x4].forEach(b => {
        if (b) b.className = 'flex-1 py-1.5 rounded-lg bg-[var(--muted)] text-[11px] font-bold text-[var(--muted-foreground)] hover:text-white transition';
      });

      if (mode === '4x2') {
        canvas.style.aspectRatio = '1024 / 461';
        btn4x2.className = 'flex-1 py-1.5 rounded-lg bg-[#D71920] text-[11px] font-bold text-white transition';
      } else if (mode === '4x3') {
        canvas.style.aspectRatio = '1024 / 700';
        btn4x3.className = 'flex-1 py-1.5 rounded-lg bg-[#D71920] text-[11px] font-bold text-white transition';
      } else if (mode === '4x4') {
        canvas.style.aspectRatio = '1024 / 1024';
        btn4x4.className = 'flex-1 py-1.5 rounded-lg bg-[#D71920] text-[11px] font-bold text-white transition';
      }
      updateEventDisplay();
    }

    function updateEventDisplay() {
      const singleRow = document.getElementById('rowEventSingle');
      const twoLineRow = document.getElementById('rowEventTwoLine');
      const isTall = currentHeightMode !== '4x2';
      const isLong = currentEventTitle.length > 18;

      if (isTall && isLong) {
        singleRow.classList.add('hidden');
        twoLineRow.classList.remove('hidden');
        twoLineRow.classList.add('flex');
        const words = currentEventTitle.split(' ');
        const half = Math.ceil(words.length / 2);
        document.getElementById('txtEventLine1').innerText = words.slice(0, half).join(' ');
        document.getElementById('txtEventLine2').innerText = words.slice(half).join(' ');
      } else {
        singleRow.classList.remove('hidden');
        twoLineRow.classList.add('hidden');
        twoLineRow.classList.remove('flex');
        document.getElementById('txtEvent').innerText = currentEventTitle;
      }
    }
  </script>
