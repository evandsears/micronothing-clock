# Project-wide Gradle settings.

org.gradle.java.home=/Applications/Android Studio.app/Contents/jbr/Contents/Home
# JVM memory configuration: grants the Gradle daemon 2GB of heap space (prevents OutOfMemory / GC thrashing)
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# AndroidX package structure is required for Jetpack Compose and modern Android libraries
android.useAndroidX=true

# Namespacing of library R classes
android.nonTransitiveRClass=true

# Kotlin style
kotlin.code.style=official
